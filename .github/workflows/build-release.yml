# Builds the APK on every push to master and publishes it as a GitHub Release.
# Fails if the signing secrets are not configured: a public release signed with
# a throwaway key would not install over the previous version.
name: Build & Release APK

on:
  push:
    branches: [master]
    paths:
      - 'app/build.gradle.kts'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create releases

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Inject version into build.gradle.kts ──────────────────────────
      # Versioning: the GitHub tag and APK versionName come EXACTLY from
      # versionName in app/build.gradle.kts (e.g. "0.4.2" → tag v0.4.2), so
      # releases and app version always match. versionCode stays tied to
      # run_number because Android requires a monotonically increasing
      # integer for in-place updates.
      - name: Compute version
        id: version
        run: |
          VERSION="$(grep -oP 'versionName = "\K[0-9]+\.[0-9]+\.[0-9]+' app/build.gradle.kts | head -1)"
          if [ -z "$VERSION" ]; then
            echo "❌ Could not parse a MAJOR.MINOR.PATCH versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          echo "✅ tag=v${VERSION} versionCode=${{ github.run_number }} (run_number)"

      # ── Signing keystore ──────────────────────────────────────────────
      # Public releases MUST be signed with the project key: an APK signed with
      # a throwaway key does not install over the previous version, although
      # the release notes promise it does. Without the secrets the job fails
      # (the temporary-keystore fallback only exists in develop.yml).
      - name: Set up signing keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] \
             || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "❌ Signing secrets are missing: refusing to publish a release signed with a throwaway key." >&2
            exit 1
          fi
          echo "🔓 Using project signing keystore from secrets"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > /tmp/atril-release.jks
          cat > keystore.properties <<EOF
          storeFile=/tmp/atril-release.jks
          storePassword=${SIGNING_STORE_PASSWORD}
          keyAlias=${SIGNING_KEY_ALIAS}
          keyPassword=${SIGNING_KEY_PASSWORD}
          EOF
          echo "✅ keystore.properties created"

      # ── Build both debug and release ──────────────────────────────────
      - name: Build Release APK
        env:
          ATRIL_REPORT_URL: ${{ secrets.ATRIL_REPORT_URL }}
          ATRIL_REPORT_KEY: ${{ secrets.ATRIL_REPORT_KEY }}
        run: ./gradlew assembleRelease

      # Gradle always generates app-release.apk; we rename it to the same pattern
      # as the Linux AppImages (Atril-vX.Y.Z-<platform>.ext).
      - name: Rename APK to release pattern
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/Atril-v${{ steps.version.outputs.version }}-android.apk"
          ls -la app/build/outputs/apk/release/

      # SHA-256 next to each artifact so users (and a future in-app updater
      # check) can verify the download.
      - name: Compute SHA-256
        working-directory: app/build/outputs/apk/release
        run: |
          APK="Atril-v${{ steps.version.outputs.version }}-android.apk"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: atril-release
          path: |
            app/build/outputs/apk/release/Atril-v${{ steps.version.outputs.version }}-android.apk
            app/build/outputs/apk/release/Atril-v${{ steps.version.outputs.version }}-android.apk.sha256

      # Rebuilding the same version must not fail on an existing tag/release:
      # delete the previous release and tag so the step below recreates them.
      # Done only after a successful signed build, so a failure never leaves
      # the version without its release.
      - name: Clear previous release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          echo "Cleaning release/tag ${TAG} if it exists..."
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || echo "(no previous release)"

      # ── Create / update a release with the APK ────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            **Atril** – cross-platform build generated automatically

            **Commit:** [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            > **Android package:** from v0.9.0 Atril uses `com.davidadrianrg.atril`. If you come from RomM Sync, install this APK manually; in-app updates only work between Atril versions.

            ### 📦 Downloads

            | File | Platform |
            |---|---|
            | `Atril-v${{ steps.version.outputs.version }}-android.apk` | Android (R8 minified) |
            | `Atril-v${{ steps.version.outputs.version }}-linux-x86_64.AppImage` | Linux x86_64 (SteamOS, Steam Deck, most PCs) |
            | `Atril-v${{ steps.version.outputs.version }}-linux-aarch64.AppImage` | Linux ARM64 (Raspberry Pi 5, ARM handhelds) |

            ### 🔄 How to update

            - **Android:** Settings → Updates → *Check for updates*, or download the attached APK and open it — it installs over the previous version without losing data.
            - **Linux:** download the AppImage for your architecture, give it execute permission (`chmod +x`) and run it. Replaces the previous file.
            - **If the AppImage does not start** (`libfuse.so.2` missing): run `APPIMAGE_EXTRACT_AND_RUN=1 ./Atril-...AppImage` or install `libfuse2`.

            ### 🔐 Verify

            Each file has a `.sha256` next to it: `sha256sum -c Atril-...apk.sha256`.
          files: |
            app/build/outputs/apk/release/Atril-v${{ steps.version.outputs.version }}-android.apk
            app/build/outputs/apk/release/Atril-v${{ steps.version.outputs.version }}-android.apk.sha256
