org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Resiliencia ante 429 (rate-limit) de Maven Central en CI: reintenta hasta 5
# veces con backoff exponencial desde 1 s. Los fallos vistos (zxing core,
# okio) son solo de red, no de código.
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.max.retries.initial.interval=1000
